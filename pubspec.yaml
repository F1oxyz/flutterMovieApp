name: mi_primer_crud
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

fonts:
  - family: PlusJakartaSans
    fonts:
      - asset: lib/fonts/PlusJakartaSans-ExtraLight.ttf
        weight: 200
      - asset: lib/fonts/PlusJakartaSans-ExtraLightItalic.ttf
        weight: 200
        style: italic
      - asset: lib/fonts/PlusJakartaSans-Light.ttf
        weight: 300
      - asset: lib/fonts/PlusJakartaSans-LightItalic.ttf
        weight: 300
        style: italic
      - asset: lib/fonts/PlusJakartaSans-Regular.ttf
        weight: 400
      - asset: lib/fonts/PlusJakartaSans-Italic.ttf
        weight: 400
        style: italic
      - asset: lib/fonts/PlusJakartaSans-Medium.ttf
        weight: 500
      - asset: lib/fonts/PlusJakartaSans-MediumItalic.ttf
        weight: 500
        style: italic
      - asset: lib/fonts/PlusJakartaSans-SemiBold.ttf
        weight: 600
      - asset: lib/fonts/PlusJakartaSans-SemiBoldItalic.ttf
        weight: 600
        style: italic
      - asset: lib/fonts/PlusJakartaSans-Bold.ttf
        weight: 700
      - asset: lib/fonts/PlusJakartaSans-BoldItalic.ttf
        weight: 700
        style: italic
      - asset: lib/fonts/PlusJakartaSans-ExtraBold.ttf
        weight: 800
      - asset: lib/fonts/PlusJakartaSans-ExtraBoldItalic.ttf
        weight: 800
        style: italic
      